name: MacEmissions
options:
  bundleIdPrefix: com.ashwinm
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: CNKCL6ZB39
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
targets:
  MacEmissions:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["*.entitlements"]
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacEmissions
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: MacEmissions uses your location to find which electricity grid your Mac is running on, so it can estimate the carbon emissions and cost of the energy it uses. Only the country, US state, grid region and local electricity price are kept.
        NSLocationUsageDescription: MacEmissions uses your location to find which electricity grid your Mac is running on, so it can estimate the carbon emissions and cost of the energy it uses. Only the country, US state, grid region and local electricity price are kept.
    settings:
      base:
        PRODUCT_NAME: MacEmissions
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinm.macemissions
        CODE_SIGN_ENTITLEMENTS: App/MacEmissions.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MacEmissionsWidgetExtension
        embed: true
  MacEmissionsWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes: ["*.entitlements"]
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MacEmissions
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinm.macemissions.widget
        CODE_SIGN_ENTITLEMENTS: Widget/MacEmissionsWidgetExtension.entitlements
